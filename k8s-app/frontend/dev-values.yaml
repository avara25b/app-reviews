app_name: reviews-frontend
replica_count: 1
port: 80
image: 
  repo: 505789305843.dkr.ecr.us-east-1.amazonaws.com/reviews-frontend
  tag: "0.1"
serviceType: LoadBalancer
resources:
  requests:
    memory: "25Mi"
    cpu: "32m"
  limits:
    memory: "100Mi"
    cpu: "64m"
ingress:
  enabled: true
  endpoint: reviews-dev.exchangeweb.net
env:
  - name: DB_USERNAME
    value: "admin"
  - name: DB_PASSWORD
    value: "password123"
  - name: DB_HOST
    valueFrom:
      secretKeyRef:
        name: reviews-backend-secretes
        key: db_host
  