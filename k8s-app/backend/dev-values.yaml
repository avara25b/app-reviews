app_name: reviews-backend
replica_count: 1
port: 80
image: 
  repo: 505789305843.dkr.ecr.us-east-1.amazonaws.com/reviews-backend
  tag: "0.1"
serviceType: LoadBalancer
resources: {}
ingress:
  enabled: false

env:
  - name: DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: reviews-db-secretes
        key: db-user
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: reviews-db-secretes
        key: password
  - name: DB_ENDPOINT
    valueFrom:
      secretKeyRef:
        name: reviews-db-secretes
        key: db-endpoint
  - name: DB_NAME
    valueFrom:
      secretKeyRef:
        name: reviews-db-secretes
        key: db-name